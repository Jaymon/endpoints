[project]
requires-python = ">=3.10"
description = "Get an api up and running quickly"
authors = [
  { name = "Jay Marcyes", email = "jay@marcyes.com" }
]
keywords = [
  "asgi",
  "asgi-server",
  "wsgi",
  "wsgi-server",
  "api",
  "api-server",
  "server",
  "framework",
  "web-framework",
  "REST",
  "rest-api",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: CGI Tools/Libraries",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "datatypes~=0.37.0",
]
name = "endpoints"
dynamic = [
  "version",
]
readme = "README.md"
license = "MIT"
license-files = [
  "LICENSE.txt",
]

[project.urls]
Homepage = "https://github.com/Jaymon/endpoints"
Repository = "https://github.com/Jaymon/endpoints"

[project.optional-dependencies]
tests = [
  "testdata",
  "uvicorn~=0.41.0",
]
websockets = [
  "websocket-client~=1.9.0",
]
templates = [
  "jinja2~=3.1.6",
]
openapi = [
  "jsonschema~=4.25.1",
  "pyyaml~=6.0.3",
]
orjson = [
  "orjson~=3.11.3",
]

[project.scripts]
endpoints = "endpoints.__main__:application"

[build-system]
requires = [
  "setuptools>=62.3.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = [
  "tests*",
  "example*",
  "*_test*",
  "docs*",
]
include = [
  "endpoints*",
]

[tool.setuptools.dynamic]
version = { attr = "endpoints.__version__" }

